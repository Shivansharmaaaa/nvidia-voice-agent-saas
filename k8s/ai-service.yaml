apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: voice-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: voice-agent-ai:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: BACKEND_API_URL
          value: "http://backend:80/api"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3002"
        ports:
        - containerPort: 3002
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: voice-agent
spec:
  selector:
    app: ai-service
  ports:
  - port: 80
    targetPort: 3002
  type: ClusterIP
